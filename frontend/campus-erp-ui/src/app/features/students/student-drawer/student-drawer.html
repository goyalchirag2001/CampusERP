<div class="drawer-overlay">
  <div class="drawer-panel">
    <div class="drawer-header">
      <h2>Add Student</h2>

      <button mat-button (click)="close()">Close</button>
    </div>

    <form [formGroup]="form">
      <mat-form-field appearance="outline">
        <mat-label>First Name</mat-label>
        <input matInput formControlName="firstName" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Last Name</mat-label>
        <input matInput formControlName="lastName" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Phone Number</mat-label>
        <input matInput formControlName="phoneNumber" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Roll Number</mat-label>
        <input matInput formControlName="rollNumber" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Batch</mat-label>
        <input matInput formControlName="batch" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Admission Date</mat-label>
        <input matInput type="date" formControlName="admissionDate" />
      </mat-form-field>
    </form>

    <div class="drawer-footer">
      <button mat-button (click)="close()">Cancel</button>

      <button mat-raised-button (click)="save()">Save Student</button>
    </div>
  </div>
</div>
