<div class="campus-page">
  <div class="page-header">
    <div>
      <h1>Students</h1>

      <p>Manage students</p>
    </div>

    <button mat-flat-button class="create-btn" (click)="createStudent()">
      <mat-icon>add</mat-icon>

      Add Student
    </button>
  </div>

  <div class="toolbar">
    <div class="search-box">
      <mat-icon>search</mat-icon>

      <input
        placeholder="Search students..."
        [ngModel]="search()"
        (ngModelChange)="search.set($event)"
      />
    </div>
  </div>

  <div class="table-container">
    <table mat-table [dataSource]="pagedStudents()">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Student</th>

        <td mat-cell *matCellDef="let student">
          {{ student.firstName }}
          {{ student.lastName }}
        </td>
      </ng-container>

      <ng-container matColumnDef="rollNumber">
        <th mat-header-cell *matHeaderCellDef>Roll No.</th>

        <td mat-cell *matCellDef="let student">
          {{ student.rollNumber }}
        </td>
      </ng-container>

      <ng-container matColumnDef="course">
        <th mat-header-cell *matHeaderCellDef>Course</th>

        <td mat-cell *matCellDef="let student">
          {{ student.courseName }}
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>

        <td mat-cell *matCellDef="let student">
          <span class="status-badge" [class.inactive]="!student.isActive">
            {{ student.isActive ? 'Active' : 'Inactive' }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>

        <td mat-cell *matCellDef="let student">
          <button mat-button (click)="openStudent(student.id)">View</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator
      [length]="filteredStudents().length"
      [pageSize]="pageSize()"
      [pageSizeOptions]="[5, 10, 20, 50]"
      (page)="onPageChange($event)"
    >
    </mat-paginator>
  </div>
</div>
