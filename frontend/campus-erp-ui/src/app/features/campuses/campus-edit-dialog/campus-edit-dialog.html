<h2 mat-dialog-title>Edit Campus</h2>

<mat-dialog-content>
  <form [formGroup]="form">
    <mat-form-field appearance="outline">
      <mat-label> Campus Name </mat-label>

      <input matInput formControlName="name" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label> Campus Code </mat-label>

      <input matInput formControlName="code" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label> Campus Head </mat-label>

      <input matInput formControlName="campusHeadName" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>

      <input matInput formControlName="email" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Phone</mat-label>

      <input matInput formControlName="phone" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label> Address </mat-label>

      <textarea matInput rows="4" formControlName="address"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="close()">Cancel</button>

  <button mat-flat-button color="primary" (click)="save()">Save</button>
</mat-dialog-actions>
