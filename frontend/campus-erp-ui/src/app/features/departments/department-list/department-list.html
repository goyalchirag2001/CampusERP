<div class="campus-page">
  <div class="page-header">
    <div>
      <h1>Departments</h1>

      <p>Manage departments</p>
    </div>

    <button mat-flat-button class="create-btn" (click)="createDepartment()">
      <mat-icon>add</mat-icon>

      Add Department
    </button>
  </div>

  <div class="toolbar">
    <div class="search-box">
      <mat-icon>search</mat-icon>

      <input
        placeholder="Search departments..."
        [ngModel]="search()"
        (ngModelChange)="search.set($event)"
      />
    </div>
  </div>

  <div class="table-container">
    <table mat-table [dataSource]="pagedDepartments()">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>

        <td mat-cell *matCellDef="let department">
          {{ department.name }}
        </td>
      </ng-container>

      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef>Code</th>

        <td mat-cell *matCellDef="let department">
          {{ department.code }}
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>

        <td mat-cell *matCellDef="let department">
          <span class="status-badge" [class.inactive]="!department.isActive">
            {{ department.isActive ? 'Active' : 'Inactive' }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>

        <td mat-cell *matCellDef="let department">
          <button
            mat-icon-button
            color="primary"
            (click)="openDepartment(department.id)"
            matTooltip="View Details"
          >
            <mat-icon>visibility</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator
      [length]="filteredDepartments().length"
      [pageSize]="pageSize()"
      [pageSizeOptions]="[5, 10, 20, 50]"
      (page)="onPageChange($event)"
    >
    </mat-paginator>
  </div>
</div>
