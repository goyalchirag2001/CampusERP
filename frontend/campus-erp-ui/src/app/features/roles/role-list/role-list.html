<div class="role-page">
  <div class="page-header">
    <div>
      <h1>Roles</h1>

      <p>Manage roles and permissions</p>
    </div>

    <button mat-flat-button class="create-btn" (click)="createRole()">
      <mat-icon>add</mat-icon>

      Create Role
    </button>
  </div>

  <div class="toolbar">
    <div class="search-box">
      <mat-icon>search</mat-icon>

      <input
        placeholder="Search roles..."
        [ngModel]="search()"
        (ngModelChange)="search.set($event)"
      />
    </div>
  </div>

  <div class="table-container">
    <table mat-table [dataSource]="pagedRoles()">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Role</th>

        <td mat-cell *matCellDef="let role">
          {{ role.name }}
        </td>
      </ng-container>

      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef>Type</th>

        <td mat-cell *matCellDef="let role">
          {{ role.isSystemRole ? 'System' : 'Custom' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="permissions">
        <th mat-header-cell *matHeaderCellDef>Permissions</th>

        <td mat-cell *matCellDef="let role">
          {{ role.permissions.length }}
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>

        <td mat-cell *matCellDef="let role">
          <span class="status-badge" [class.inactive]="!role.isActive">
            {{ role.isActive ? 'Active' : 'Inactive' }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>

        <td mat-cell *matCellDef="let role">
          <button mat-button (click)="openRole(role.id)">View</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator
      [length]="filteredRoles().length"
      [pageSize]="pageSize()"
      [pageSizeOptions]="[5, 10, 20, 50]"
      (page)="onPageChange($event)"
    >
    </mat-paginator>
  </div>
</div>
