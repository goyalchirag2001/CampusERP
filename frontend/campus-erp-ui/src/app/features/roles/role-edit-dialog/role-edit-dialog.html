<div class="dialog-container">
  <div class="dialog-header">
    <h2>Edit Role</h2>

    <p>Update role information and permissions.</p>
  </div>

  <form [formGroup]="form">
    <div class="form-grid">
      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>

        <input matInput formControlName="name" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Description</mat-label>

        <input matInput formControlName="description" />
      </mat-form-field>
    </div>

    <div class="permissions-section">
      <h3>Permissions</h3>

      <div class="permission-actions">
        <button mat-stroked-button type="button" (click)="selectAllPermissions()">
          Select All
        </button>

        <button mat-stroked-button type="button" (click)="clearAllPermissions()">Clear All</button>
      </div>

      <div class="permission-groups">
        @for (group of groupedPermissions(); track group.module) {
          <div class="permission-group">
            <div class="module-header">
              <h3>
                {{ group.module }}
              </h3>

              <mat-checkbox
                [checked]="isModuleSelected(group.module)"
                (change)="toggleModulePermissions(group.module, $event.checked)"
              >
                Select All
              </mat-checkbox>
            </div>

            <div class="permission-grid">
              @for (permission of group.permissions; track permission.id) {
                <mat-checkbox
                  [checked]="isSelected(permission.id)"
                  (change)="togglePermission(permission.id, $event.checked)"
                >
                  {{ permission.name }}
                </mat-checkbox>
              }
            </div>
          </div>
        }
      </div>
    </div>

    <div class="actions">
      <button mat-stroked-button type="button" (click)="cancel()">Cancel</button>

      <button mat-flat-button type="button" (click)="save()">Save Changes</button>
    </div>
  </form>
</div>
