<div class="institution-page">
  <div class="page-header">
    <div>
      <h1>Institutions</h1>

      <p>Manage universities onboarded to CampusERP</p>
    </div>

    <button mat-flat-button class="create-btn" (click)="createInstitution()">
      <mat-icon> add </mat-icon>

      Add Institution
    </button>
  </div>

  <div class="toolbar">
    <div class="search-box">
      <mat-icon> search </mat-icon>

      <input
        placeholder="Search institutions..."
        [ngModel]="search()"
        (ngModelChange)="search.set($event)"
      />
    </div>
  </div>

  <div class="table-container">
    <table mat-table [dataSource]="pagedInstitutions()">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Institution</th>

        <td mat-cell *matCellDef="let institution">
          <div class="institution-cell">
            <div class="institution-avatar">
              {{ institution.name.charAt(0) }}
            </div>

            <div>
              <strong>
                {{ institution.name }}
              </strong>
            </div>
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef>Code</th>

        <td mat-cell *matCellDef="let institution">
          {{ institution.code }}
        </td>
      </ng-container>

      <ng-container matColumnDef="slug">
        <th mat-header-cell *matHeaderCellDef>Login Slug</th>

        <td mat-cell *matCellDef="let institution">
          {{ institution.loginSlug }}
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>

        <td mat-cell *matCellDef="let institution">
          <span class="status-badge" [class.inactive]="!institution.isActive">
            {{ institution.isActive ? 'Active' : 'Inactive' }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>

        <td mat-cell *matCellDef="let institution">
          <button mat-button (click)="openInstitution(institution.id)">View</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    <mat-paginator
      [length]="filteredInstitutions().length"
      [pageSize]="pageSize()"
      [pageSizeOptions]="[5, 10, 20, 50]"
      (page)="onPageChange($event)"
    >
    </mat-paginator>
  </div>
</div>
