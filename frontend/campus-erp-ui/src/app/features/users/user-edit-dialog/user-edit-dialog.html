<div class="dialog-container">
  <div class="dialog-header">
    <div>
      <h2>Edit User</h2>

      <p>Update user information, campus and role assignments.</p>
    </div>
  </div>

  <form [formGroup]="form">
    <div class="section-title">User Information</div>

    <div class="form-grid">
      <mat-form-field appearance="outline">
        <mat-label>First Name</mat-label>

        <input matInput formControlName="firstName" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Last Name</mat-label>

        <input matInput formControlName="lastName" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>

        <input matInput formControlName="email" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Phone Number</mat-label>

        <input matInput formControlName="phoneNumber" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Campus</mat-label>

        <mat-select formControlName="campusId">
          @for (campus of campuses(); track campus.id) {
            <mat-option [value]="campus.id">
              {{ campus.name }}
            </mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>

    <div class="section-title roles-title">Roles</div>

    <div class="roles-panel">
      <div class="roles-grid">
        @for (role of roles(); track role.id) {
          <div class="role-item" [class.selected]="isRoleSelected(role.id)">
            <mat-checkbox
              [checked]="isRoleSelected(role.id)"
              (change)="toggleRole(role.id, $event.checked)"
            >
              {{ role.name }}
            </mat-checkbox>
          </div>
        }
      </div>
    </div>

    <div class="actions">
      <button mat-stroked-button type="button" (click)="cancel()">Cancel</button>

      <button mat-flat-button color="primary" type="button" (click)="save()">Save Changes</button>
    </div>
  </form>
</div>
