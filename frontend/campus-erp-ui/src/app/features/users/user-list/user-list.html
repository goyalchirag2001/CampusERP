<div class="user-page">
  <div class="page-header">
    <div>
      <h1>Users</h1>

      <p>Manage platform and institution users</p>
    </div>

    <button mat-flat-button class="create-btn" (click)="createUser()">
      <mat-icon>add</mat-icon>

      Add User
    </button>
  </div>

  <div class="toolbar">
    <div class="search-box">
      <mat-icon>search</mat-icon>

      <input
        placeholder="Search users..."
        [ngModel]="search()"
        (ngModelChange)="search.set($event)"
      />
    </div>
  </div>

  <div class="table-container">
    <table mat-table [dataSource]="pagedUsers()">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>User</th>

        <td mat-cell *matCellDef="let user">
          <div class="user-cell">
            <div class="user-avatar">
              {{ user.firstName.charAt(0) }}
            </div>

            <div>
              <strong>{{ user.firstName }} {{ user.lastName }}</strong>
            </div>
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>

        <td mat-cell *matCellDef="let user">
          {{ user.email }}
        </td>
      </ng-container>

      <ng-container matColumnDef="campus">
        <th mat-header-cell *matHeaderCellDef>Campus</th>

        <td mat-cell *matCellDef="let user">
          {{ user.campusName }}
        </td>
      </ng-container>

      <ng-container matColumnDef="roles">
        <th mat-header-cell *matHeaderCellDef>Roles</th>

        <td mat-cell *matCellDef="let user">
          {{ user.roles.join(', ') }}
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>

        <td mat-cell *matCellDef="let user">
          <span class="status-badge" [class.inactive]="!user.isActive">
            {{ user.isActive ? 'Active' : 'Inactive' }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>

        <td mat-cell *matCellDef="let user">
          <button mat-button (click)="openUser(user.id)">View</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator
      [length]="filteredUsers().length"
      [pageSize]="pageSize()"
      [pageSizeOptions]="[5, 10, 20, 50]"
      (page)="onPageChange($event)"
    >
    </mat-paginator>
  </div>
</div>
