<h2 mat-dialog-title>User Created Successfully</h2>

<mat-dialog-content>
  <p>Please share this temporary password with the user.</p>

  <div class="password-box">
    {{ data.password }}
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="copyPassword()">Copy Password</button>

  <button mat-flat-button mat-dialog-close>Close</button>
</mat-dialog-actions>
