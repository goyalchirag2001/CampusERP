<div class="campus-page">
  <div class="page-header">
    <div>
      <h1>Courses</h1>

      <p>Manage courses</p>
    </div>

    <button mat-flat-button class="create-btn" (click)="createCourse()">
      <mat-icon>add</mat-icon>

      Add Course
    </button>
  </div>

  <div class="toolbar">
    <div class="search-box">
      <mat-icon>search</mat-icon>

      <input
        placeholder="Search courses..."
        [ngModel]="search()"
        (ngModelChange)="search.set($event)"
      />
    </div>
  </div>

  <div class="table-container">
    <table mat-table [dataSource]="pagedCourses()">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Course</th>

        <td mat-cell *matCellDef="let course">
          <div>
            <strong>
              {{ course.name }}
            </strong>

            <div class="secondary-text">
              {{ course.code }}
            </div>
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="department">
        <th mat-header-cell *matHeaderCellDef>Department</th>

        <td mat-cell *matCellDef="let course">
          {{ course.departmentName }}
        </td>
      </ng-container>

      <ng-container matColumnDef="degreeType">
        <th mat-header-cell *matHeaderCellDef>Degree</th>

        <td mat-cell *matCellDef="let course">
          {{ course.degreeType }}
        </td>
      </ng-container>

      <ng-container matColumnDef="duration">
        <th mat-header-cell *matHeaderCellDef>Duration</th>

        <td mat-cell *matCellDef="let course">{{ course.durationYears }} Years</td>
      </ng-container>

      <ng-container matColumnDef="semesters">
        <th mat-header-cell *matHeaderCellDef>Semesters</th>

        <td mat-cell *matCellDef="let course">
          {{ course.totalSemesters }}
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>

        <td mat-cell *matCellDef="let course">
          <span class="status-badge" [class.inactive]="!course.isActive">
            {{ course.isActive ? 'Active' : 'Inactive' }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>

        <td mat-cell *matCellDef="let course">
          <button
            mat-icon-button
            color="primary"
            (click)="openCourse(course.id)"
            matTooltip="View Details"
          >
            <mat-icon>visibility</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator
      [length]="filteredCourses().length"
      [pageSize]="pageSize()"
      [pageSizeOptions]="[5, 10, 20, 50]"
      (page)="onPageChange($event)"
    >
    </mat-paginator>
  </div>
</div>
