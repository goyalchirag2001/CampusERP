<div class="campus-page">
  <div class="page-header">
    <div>
      <h1>Subjects</h1>

      <p>Manage academic subjects</p>
    </div>

    <button mat-flat-button class="create-btn" (click)="createSubject()">
      <mat-icon>add</mat-icon>

      Add Subject
    </button>
  </div>

  <div class="toolbar">
    <div class="search-box">
      <mat-icon>search</mat-icon>

      <input
        placeholder="Search subjects..."
        [ngModel]="search()"
        (ngModelChange)="search.set($event)"
      />
    </div>
  </div>

  <div class="table-container">
    <table mat-table [dataSource]="pagedSubjects()">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Subject</th>

        <td mat-cell *matCellDef="let subject">
          {{ subject.name }}
        </td>
      </ng-container>

      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef>Code</th>

        <td mat-cell *matCellDef="let subject">
          {{ subject.code }}
        </td>
      </ng-container>

      <ng-container matColumnDef="credits">
        <th mat-header-cell *matHeaderCellDef>Credits</th>

        <td mat-cell *matCellDef="let subject">
          {{ subject.credits }}
        </td>
      </ng-container>

      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef>Type</th>

        <td mat-cell *matCellDef="let subject">
          {{ getTypeName(subject.subjectType) }}
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>

        <td mat-cell *matCellDef="let subject">
          <span class="status-badge" [class.inactive]="!subject.isActive">
            {{ subject.isActive ? 'Active' : 'Inactive' }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>

        <td mat-cell *matCellDef="let subject">
          <button mat-button (click)="openSubject(subject.id)">View</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator
      [length]="filteredSubjects().length"
      [pageSize]="pageSize()"
      [pageSizeOptions]="[5, 10, 20, 50]"
      (page)="onPageChange($event)"
    >
    </mat-paginator>
  </div>
</div>
