<h2 mat-dialog-title>Edit Subject</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="dialog-form">
    <mat-form-field appearance="outline">
      <mat-label>Subject Code</mat-label>

      <input matInput formControlName="code" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Subject Name</mat-label>

      <input matInput formControlName="name" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Credits</mat-label>

      <input matInput type="number" formControlName="credits" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Subject Type</mat-label>

      <mat-select formControlName="subjectType">
        @for (type of subjectTypes; track type.value) {
          <mat-option [value]="type.value">
            {{ type.label }}
          </mat-option>
        }
      </mat-select>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="close()">Cancel</button>

  <button mat-flat-button color="primary" (click)="save()">Save</button>
</mat-dialog-actions>
