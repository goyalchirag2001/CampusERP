<button mat-button class="user-trigger" [matMenuTriggerFor]="userMenu">
  <div class="trigger-avatar">
    @if (userContext.hasProfilePhoto()) {
      <img [src]="userContext.profilePhoto()!" alt="Profile Photo" />
    } @else {
      {{ userContext.avatarInitials() }}
    }
  </div>

  <div class="trigger-content">
    <div class="trigger-name">
      {{ userContext.fullName() }}
    </div>

    <div class="trigger-role">
      {{ userContext.roleDisplay() }}
    </div>
  </div>

  <mat-icon> expand_more </mat-icon>
</button>

<mat-menu #userMenu="matMenu" class="user-menu">
  <div class="menu-profile">
    <div class="menu-avatar">
      @if (userContext.hasProfilePhoto()) {
        <img [src]="userContext.profilePhoto()!" alt="Profile" />
      } @else {
        {{ userContext.avatarInitials() }}
      }
    </div>

    <div class="menu-user">
      <div class="menu-name">
        {{ userContext.fullName() }}
      </div>

      <div class="menu-role">
        {{ userContext.roleDisplay() }}
      </div>
    </div>
  </div>

  <mat-divider></mat-divider>

  <button mat-menu-item (click)="openProfile()">
    <mat-icon>person</mat-icon>

    <span>My Profile</span>
  </button>

  <button mat-menu-item (click)="changePassword()">
    <mat-icon>lock</mat-icon>

    <span>Change Password</span>
  </button>

  <mat-divider></mat-divider>

  <button mat-menu-item (click)="logout()">
    <mat-icon>logout</mat-icon>

    <span>Logout</span>
  </button>
</mat-menu>
